spring.application.name=securecampus

# Conexión Oracle (soporta variables de entorno con fallback a la PDB local orclpdb21c)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/orclpdb21c}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME:securecampus}
spring.datasource.password=${DB_PASSWORD:123}

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Mensajes / i18n
spring.messages.basename=messages
spring.messages.encoding=UTF-8
