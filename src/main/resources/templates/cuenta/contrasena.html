<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{template :: head('Cambiar contraseña')}"></head>
<body class="portal-body">
    <nav th:replace="~{template :: navbar}"></nav>
    <main class="container py-4">
        <section class="main-sheet mx-auto" style="max-width: 680px">
            <div class="d-flex justify-content-between align-items-center gap-3 mb-4">
                <h1 class="h3 fw-bold mb-0">Cambiar contraseña</h1>
                <a th:href="@{/acceso}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">Volver al panel</a>
            </div>
            <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
            <div th:if="${exito}" class="alert alert-success" role="status" th:text="${exito}"></div>
            <form th:action="@{/cuenta/contrasena}" method="post" class="vstack gap-3">
                <div>
                    <label for="contrasenaActual" class="form-label">Contraseña actual</label>
                    <input id="contrasenaActual" name="contrasenaActual" type="password"
                           autocomplete="current-password" class="form-control" required>
                </div>
                <div>
                    <label for="nuevaContrasena" class="form-label">Nueva contraseña</label>
                    <input id="nuevaContrasena" name="nuevaContrasena" type="password"
                           autocomplete="new-password" minlength="8" maxlength="72"
                           pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,72}"
                           class="form-control" required>
                    <div class="form-text">Mínimo 8 caracteres, con al menos una mayúscula, un número y un carácter especial.</div>
                </div>
                <div>
                    <label for="confirmarContrasena" class="form-label">Confirmar nueva contraseña</label>
                    <input id="confirmarContrasena" name="confirmarContrasena" type="password"
                           autocomplete="new-password" minlength="8" maxlength="72"
                           pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,72}"
                           class="form-control" required>
                </div>
                <div>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">Guardar contraseña</button>
                </div>
            </form>
        </section>
    </main>
    <footer th:replace="~{template :: footer}"></footer>
</body>
</html>
