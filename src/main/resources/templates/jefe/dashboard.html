<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:with="pageTitle='Gestión Académica - Jefe de Departamento | SecureCampus'">
    <head th:replace="~{template :: head(${pageTitle})}"></head>
  </head>
  <body class="portal-body">
    <!-- Navbar global -->
    <nav th:replace="~{template :: navbar}"></nav>

    <main>
      <div class="badge-wrapper">

          <!-- LADO IZQUIERDO: Credencial de Identificación del Jefe de Departamento -->
          <aside class="department-id-badge">
              <div class="badge-avatar">
                <i class="bi bi-person-workspace"></i>
              </div>
              
              <!-- Nombre completo dinámico obtenido del objeto usuario -->
              <h4 class="fw-bold mb-1 text-dark" 
                  th:text="${usuario != null ? usuario.nombre + ' ' + usuario.apellidoPaterno + ' ' + usuario.apellidoMaterno : 'Jefe/Jefa'}">
                  Nombre completo
              </h4>
              
              <!-- Número de control / empleado -->
              <p class="text-muted small mb-1" th:text="${numeroControl}">No.Control</p>
              
              <!-- Rol o departamento -->
              <p class="text-muted small mb-2">
                <i class="bi bi-building me-1"></i>
                <span th:text="#{jefe.dashboard.badge.role}">Jefatura de departamento</span>
              </p>
          </aside>

        <!-- LADO DERECHO: Hoja de Contenido Principal -->
        <section class="main-sheet">

          <!-- Alertas y notificaciones -->
          <div th:replace="~{fragments/alerts :: alertasDashboardJefe}"></div>

          <!-- Encabezado de la página -->
          <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
              <p class="eyebrow text-uppercase text-orange fw-bold mb-1" th:text="#{jefe.dashboard.eyebrow}">COORDINACIÓN Y PLANES DE ESTUDIO</p>
              <h1 class="h2 fw-bold text-navy mb-1" th:text="#{jefe.dashboard.maintitle}">Gestión de la oferta académica</h1>
              <p class="text-secondary mb-0" th:text="#{jefe.dashboard.subtitle}">Supervisión integral de grupos, retícula, docentes, estadística académica y asignaciones de estudiantes.</p>
            </div>
          </div>

          <!-- Pestañas de Navegación del Jefe de Departamento -->
          <ul class="nav nav-pills mb-4 gap-2" id="jefeTabs" role="tablist">
              <!-- Pestaña 0: Inicio -->
              <li class="nav-item" role="presentation">
                <button class="nav-link active rounded-pill px-3 py-2" id="inicio-tab" data-bs-toggle="pill" data-bs-target="#tab-inicio" type="button" role="tab" aria-controls="tab-inicio" aria-selected="true">
                  <i class="bi bi-house-fill me-1"></i><span th:text="#{jefe.dashboard.tab.inicio}">Inicio</span>
                </button>
              </li>
              
              <!-- Pestaña 1: Grupos -->
              <li class="nav-item" role="presentation">
                <button class="nav-link rounded-pill px-3 py-2" id="grupos-tab" data-bs-toggle="pill" data-bs-target="#tab-grupos" type="button" role="tab" aria-controls="tab-grupos" aria-selected="false">
                  <i class="bi bi-collection-fill me-1"></i><span th:text="#{jefe.dashboard.tab.grupos}">Grupos y Oferta Académica</span>
                </button>
              </li>
              
              <!-- Pestaña 2: Alumnos -->
              <li class="nav-item" role="presentation">
                <button class="nav-link rounded-pill px-3 py-2" id="alumnos-tab" data-bs-toggle="pill" data-bs-target="#tab-alumnos" type="button" role="tab" aria-controls="tab-alumnos" aria-selected="false">
                  <i class="bi bi-people-fill me-1"></i><span th:text="#{jefe.dashboard.tab.alumnos}">Gestión de Alumnos y Cargas</span>
                </button>
              </li>
              
              <!-- Pestaña 3: Estadísticas -->
              <li class="nav-item" role="presentation">
                <button class="nav-link rounded-pill px-3 py-2" id="stats-tab" data-bs-toggle="pill" data-bs-target="#tab-stats" type="button" role="tab" aria-controls="tab-stats" aria-selected="false">
                  <i class="bi bi-graph-up me-1"></i><span th:text="#{jefe.dashboard.tab.stats}">Horarios y Estadísticas</span>
                </button>
              </li>
              
              <!-- Botón de Acción 1: Crear grupo -->
              <li class="nav-item" role="presentation">
                  <button
                    type="button"
                    class="nav-link btn-orange text-white rounded-pill px-3 py-2 shadow-sm"
                    data-bs-toggle="modal"
                    data-bs-target="#modalAsignarProfesor"
                  >
                    <i class="bi bi-person-video3 me-1"></i><span th:text="#{jefe.dashboard.btn.assigngroup}">Crear grupo y asignar docente</span>
                  </button>
              </li>
              
              <!-- Botón de Acción 2: Inscripción múltiple -->
              <li class="nav-item" role="presentation">
                  <button
                    type="button"
                    class="nav-link btn-navy text-white rounded-pill px-3 py-2 shadow-sm"
                    data-bs-toggle="modal"
                    data-bs-target="#modalInscripcionMultiple"
                  >
                    <i class="bi bi-person-plus-fill me-1"></i><span th:text="#{jefe.dashboard.btn.multiple}">Inscripción múltiple de alumnos</span>
                  </button>
              </li>
          </ul>

          <div class="tab-content" id="jefeTabsContent">
            
            <!-- TAB 0: INICIO (Modularizada) -->
            <div th:replace="~{fragments/components :: tabInicio}"></div>

            <!-- TAB 1: GRUPOS Y OFERTA ACADÉMICA -->
            <div class="tab-pane fade" id="tab-grupos" role="tabpanel" aria-labelledby="grupos-tab">
              <div th:replace="~{fragments/tables :: tablaJefeGrupos(${grupos},${periodoAsignacion})}"></div>

              <div class="card shadow-sm border-0 rounded-3 mt-4">
                <div class="card-header bg-white py-3">
                  <h5 class="card-title fw-bold text-navy mb-0">
                    <i class="bi bi-book-half text-orange me-2"></i><span th:text="#{jefe.dashboard.card.oferta}">Oferta Académica de Materias (Retícula)</span>
                  </h5>
                </div>
                <div class="card-body p-0 table-responsive">
                  <div th:replace="~{fragments/tables :: tablaJefeMaterias(${materias})}"></div>
                </div>
              </div>
            </div>

            <!-- TAB 2: GESTIÓN DE ALUMNOS Y CARGAS -->
            <div id="tab-alumnos" class="tab-pane fade" role="tabpanel" aria-labelledby="alumnos-tab">
              <div th:replace="~{fragments/components :: filtrosAlumnos}"></div>
            </div>

            <!-- TAB 3: HORARIOS Y ESTADÍSTICAS -->
            <div id="tab-stats" class="tab-pane fade" role="tabpanel" aria-labelledby="stats-tab">
              <div th:replace="~{fragments/tables :: tabEstadisticas}"></div>
              <div th:replace="~{fragments/tables :: tablaJefeDetalleGrupo}"></div>
              <div th:replace="~{fragments/tables :: tablaJefeEstadisticas(${estadisticas})}"></div>
            </div>

          </div>

        </section>

      </div>
    </main>

    <!-- Modales importados desde components.html -->
    <div th:replace="~{fragments/components :: modalAsignarProfesor(${materias},${profesores}, ${aulas},${periodoAsignacion})}"></div>
    <div th:replace="~{fragments/components :: modalCambiarDocenteJefe(${profesores})}"></div>
    <div th:replace="~{fragments/components :: modalInscripcionMultiple(${grupos})}"></div>

    <footer th:replace="~{template :: footer}"></footer>

    <!-- Script para recordar la pestaña activa al recargar (Por defecto abre en #tab-inicio) -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const activeTabKey = "jefeActiveTab";
            const triggerTabList = [].slice.call(document.querySelectorAll('#jefeTabs button[data-bs-toggle="pill"]'));
            
            // 1. Escuchar los clics para guardar la pestaña seleccionada en el navegador
            triggerTabList.forEach(function (triggerEl) {
                triggerEl.addEventListener("click", function () {
                    localStorage.setItem(activeTabKey, triggerEl.getAttribute("data-bs-target"));
                });
            });
    
            // 2. Obtener la pestaña guardada previamente
            const savedTab = localStorage.getItem(activeTabKey);
            
            // 3. Si existe una pestaña guardada Y NO ES la de inicio, actívala.
            if (savedTab && savedTab !== "#tab-inicio") {
                const tabToActivate = document.querySelector(`#jefeTabs button[data-bs-target="${savedTab}"]`);
                if (tabToActivate) {
                    const tab = new bootstrap.Tab(tabToActivate);
                    tab.show();
                }
            }
        });
    </script>
  </body>
</html>
