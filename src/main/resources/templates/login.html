<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:with="pageTitle=#{meta.title.login}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <head th:replace="~{template :: head(${pageTitle})}"></head>

        
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" th:href="@{/css/portal.css(v=5)}" />
        <link
            rel="icon"
            type="image/svg+xml"
            th:href="@{/images/favicon.svg}"
        />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        ></script>
    </head>
    <body class="login-page">
        <main
            class="container min-vh-100 d-flex align-items-center py-4 py-lg-5"
        >
            <div
                class="row login-layout w-100 align-items-center justify-content-center mx-auto"
            >
                <section class="col-12 col-md-6">
                    <div class="login-intro">
                        <div class="institution-lockup">
                            <span class="institution-seal">
                                <i class="bi bi-mortarboard-fill"></i>
                            </span>
                            <span>
                                <strong th:text="#{meta.ittol}"></strong>
                                <small th:text="#{meta.tecnm}"></small>
                            </span>
                        </div>

                        <p class="eyebrow mb-3" th:text="#{meta.login.eyebrow}"></p>
                        <h1 class="mb-3" th:text="#{meta.login.title}"></h1>
                        <p th:text="#{meta.login.description}"></p>

                        <div class="login-highlights">
                            <span>
                                <i class="bi bi-shield-check"></i>
                                <span
                                    th:text="#{meta.login.highlight.secure}"
                                ></span>
                            </span>
                        </div>
                    </div>
                </section>
                <section class="col-12 col-md-6 col-lg-5">
                    <div class="login-card">
                        <div class="brand-mark mb-4">
                            <i class="bi bi-person-lock"></i>
                        </div>
                        <p class="eyebrow mb-2" th:text="#{meta.login.welcome}"></p>
                        <h2
                            class="h3 fw-bold mb-2"
                            th:text="#{meta.login.action}"
                        ></h2>

                        <!-- Banner de error de autenticación con clase contenedora -->
                        <div
                            th:if="${param.error != null}"
                            class="flash-alert-wrapper"
                        >
                            <div
                                th:replace="~{fragments/components :: alert('danger', #{meta.login.error.credentials})}"
                            ></div>
                        </div>

                        <!-- Banner de cierre de sesión exitoso con clase contenedora -->
                        <div
                            th:if="${param.logout != null}"
                            class="flash-alert-wrapper"
                        >
                            <div
                                th:replace="~{fragments/components :: alert('success', #{meta.login.error.logout})}"
                            ></div>
                        </div>

                        <!-- Banner de cuenta bloqueada -->
                        <div
                            th:if="${param.blocked != null}"
                            class="flash-alert-wrapper"
                        >
                            <div class="alert alert-danger" role="alert" aria-live="polite">
                                <strong th:text="#{meta.login.error.block.title}">Cuenta bloqueada temporalmente:</strong>
                                <p class="mb-0 mt-1" th:text="#{meta.login.error.block.desc}">Se ha superado el límite de intentos fallidos.</p>
                            </div>
                        </div>

                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label
                                    for="numeroControl"
                                    class="form-label"
                                    th:text="#{meta.login.label.user}"
                                ></label>
                                <input
                                    id="numeroControl"
                                    name="numeroControl"
                                    class="form-control form-control-lg"
                                    type="text"
                                    autocomplete="username"
                                    maxlength="50"
                                    required
                                    autofocus
                                />
                            </div>
                            <div class="mb-4">
                                <div class="d-flex justify-content-between">
                                    <label
                                        for="password"
                                        class="form-label"
                                        th:text="#{meta.login.label.password}"
                                    ></label>
                                    <a th:href="@{/recuperar}" class="small text-decoration-none" th:text="#{meta.login.label.forgot}">¿Olvidaste tu contraseña?</a>
                                </div>
                                <input
                                    id="password"
                                    name="password"
                                    class="form-control form-control-lg"
                                    type="password"
                                    autocomplete="current-password"
                                    required
                                />
                            </div>
                            <button
                                class="btn btn-orange btn-lg w-100"
                                type="submit"
                            >
                                <span th:text="#{meta.login.btn.submit}"></span>
                                <i class="bi bi-arrow-right ms-1"></i>
                            </button>
                        </form>
                        <div class="small text-secondary mt-4 d-flex gap-2">
                            <i class="bi bi-info-circle mt-1"></i>
                            <span th:text="#{meta.login.footer.hint}"></span>
                        </div>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <div
                class="login-copyright text-center text-white-50 small pb-3"
                th:text="#{meta.template.copyright}"
            ></div>
        </footer>

        <!-- Script robusto para limpiar URL y desvanecer las alertas por clase -->
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const alertWrappers = document.querySelectorAll(
                    ".flash-alert-wrapper",
                );

                if (alertWrappers.length > 0) {
                    // Limpia los parámetros ?error o ?logout de la URL al instante para evitar efectos de caché o F5
                    if (window.history.replaceState && window.location.search) {
                        const cleanUrl =
                            window.location.protocol +
                            "//" +
                            window.location.host +
                            window.location.pathname;
                        window.history.replaceState(
                            { path: cleanUrl },
                            "",
                            cleanUrl,
                        );
                    }

                    // Temporizador para desvanecer y remover el contenedor después de 4 segundos
                    setTimeout(function () {
                        alertWrappers.forEach((wrapper) => {
                            wrapper.style.transition =
                                "opacity 0.5s ease, transform 0.5s ease";
                            wrapper.style.opacity = "0";
                            wrapper.style.transform = "translateY(-10px)";
                            setTimeout(() => wrapper.remove(), 500);
                        });
                    }, 4000);
                }
            });
        </script>
    </body>
</html>
