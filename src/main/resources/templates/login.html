        <!-- Script robusto para limpiar URL y desvanecer las alertas por clase -->
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const alertWrappers = document.querySelectorAll(
                    ".flash-alert-wrapper",
                );

                if (alertWrappers.length > 0) {
                    // Limpia los parámetros ?error o ?logout de la URL al instante para evitar efectos de caché o F5
                    if (window.history.replaceState && window.location.search) {
                        const cleanUrl =
                            window.location.protocol +
                            "//" +
                            window.location.host +
                            window.location.pathname;
                        window.history.replaceState(
                            { path: cleanUrl },
                            "",
                            cleanUrl,
                        );
                    }

                    // Temporizador para desvanecer y remover el contenedor después de 4 segundos
                    setTimeout(function () {
                        alertWrappers.forEach((wrapper) => {
                            wrapper.style.transition =
                                "opacity 0.5s ease, transform 0.5s ease";
                            wrapper.style.opacity = "0";
                            wrapper.style.transform = "translateY(-10px)";
                            setTimeout(() => wrapper.remove(), 500);
                        });
                    }, 4000);
                }
            });
        </script>
    </body>
