<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" class="h-100">
    <head th:replace="~{template :: head('Panel Docente | SecureCampus')}"></head>
    <body class="d-flex flex-column min-vh-100">
        <nav th:replace="~{template :: navbar}"></nav>

        <main class="flex-grow-1 py-4">
            <div class="container page-shell my-auto">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="eyebrow text-uppercase text-orange fw-bold mb-1">MÓDULO DE DOCENCIA</p>
                        <h1 class="h2 fw-bold text-navy mb-1">Grupos Asignados en Semestre Vigente</h1>
                        <p class="text-secondary mb-0">Docente con No. de Control: <strong th:text="${profesorControl}">00112233</strong></p>
                    </div>
                </div>

                <div class="row g-4">
                    <div th:if="${grupos == null || grupos.isEmpty()}" class="col-12">
                        <div class="alert alert-info py-4 text-center">
                            <i class="bi bi-info-circle fs-3 d-block mb-2"></i>
                            No tienes grupos académicos asignados para el periodo escolar vigente.
                        </div>
                    </div>

                    <div th:each="g : ${grupos}" class="col-md-6 col-lg-4">
                        <div class="card h-100 shadow-sm border-0 rounded-3">
                            <div class="card-body d-flex flex-column">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <span class="badge bg-navy-subtle text-navy" th:text="${g.periodo.nombre}">Periodo</span>
                                    <span class="badge bg-secondary" th:text="'Grupo: ' + ${g.codigoGrupo}">Grupo</span>
                                </div>
                                <h5 class="card-title fw-bold text-navy mb-1" th:text="${g.materia.nombre}">Materia</h5>
                                <p class="small text-muted mb-3" th:text="'Clave: ' + ${g.materia.clave} + ' · ' + ${g.materia.creditos} + ' créditos'">Clave</p>

                                <div class="mt-auto d-flex gap-2">
                                    <a th:href="@{'/profesor/grupo/' + ${g.grupoId}}" class="btn btn-orange flex-grow-1">
                                        <i class="bi bi-pencil-square me-1"></i>Calificaciones
                                    </a>
                                    <a th:href="@{'/profesor/grupo/' + ${g.grupoId} + '/pdf'}" class="btn btn-outline-danger" title="Exportar Lista Oficial PDF">
                                        <i class="bi bi-file-earmark-pdf"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{template :: footer}"></footer>
    </body>
</html>
