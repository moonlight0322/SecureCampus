<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <head th:replace="~{template :: head(#{teacher.panel.title})}"></head>
</head>
<body class="portal-body">
    <!-- Navbar global -->
    <nav th:replace="~{template :: navbar}"></nav>
    
    <main>
        <div class="badge-wrapper">

            <!-- LADO IZQUIERDO: Credencial de Identificación del Profesor -->
            <aside class="teacher-id-badge">
                <div class="badge-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark" th:text="${profesor.nombre}">Nombre completo</h4>
                <p class="text-muted small mb-2" th:text="${profesor.numeroEmpleado}">Numero empleado</p>
                <hr class="w-100 my-2 text-muted opacity-25">
                <span class="text-secondary small fw-medium" th:text="${profesor.departamento}">Departamento</span>
            </aside>

            <!-- LADO DERECHO: Hoja de Contenido Principal -->
            <section class="teacher-main-sheet">
                
                <!-- Saludo e indicador -->
                <div class="mb-4">
                    <h1 class="h2 fw-bold mb-3" th:text="#{teacher.welcome.msg(${profesor.nombre})}">
                        Bienvenido/a Nombre
                    </h1>
                    <!-- Botón Ver Grupos -->
                    <a th:href="@{/profesor/grupos}" class="btn btn-sky shadow-sm">
                        <span th:text="#{teacher.btn.view.groups}">Ver grupos</span>
                    </a>
                </div>

                <!-- Título de la tabla -->
                <h5 class="fw-bold mb-3 text-secondary mt-2" th:text="#{teacher.classes.today}">Clases de hoy</h5>

                <!-- Tabla con diseño personalizado -->
                <div class="table-responsive flex-grow-1">
                    <table class="table align-middle table-bordered border-2 bg-white rounded-3 overflow-hidden">
                        <thead class="table-sky-header">
                            <tr>
                                <th class="text-center py-3" th:text="#{teacher.table.time}">Hora</th>
                                <th class="text-center py-3" th:text="#{teacher.table.group}">Grupo</th>
                                <th class="py-3 px-4" th:text="#{teacher.table.subject}">Materia</th>
                                <th class="text-center py-3" th:text="#{teacher.table.classroom}">Aula</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="clase : ${clasesHoy}">
                                <td class="text-center fw-semibold text-secondary" th:text="${clase.hora}">08:00 - 10:00</td>
                                <td class="text-center"><span class="badge bg-light text-dark border px-2 py-1" th:text="${clase.grupo}">5SC1</span></td>
                                <td class="fw-medium px-4" th:text="${clase.materia}">Sistemas Operativos</td>
                                <td class="text-center text-muted" th:text="${clase.aula}">Lab 3</td>
                            </tr>
                            <tr th:if="${clasesHoy == null or clasesHoy.empty}">
                                <td colspan="4" class="text-center text-muted py-4">No hay clases programadas para hoy.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </section>

        </div>
    </main>
    <footer th:replace="~{template :: footer}"></footer>
</body>
</html>
