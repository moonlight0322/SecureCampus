<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:with="pageTitle=#{profesor.inicio.pagetitle}">
    <head th:replace="~{template :: head(${pageTitle})}"></head>
</head>
<body class="portal-body">
    <!-- Navbar global -->
    <nav th:replace="~{template :: navbar}"></nav>
    
    <main>
        <div class="badge-wrapper">

            <!-- LADO IZQUIERDO: Credencial de Identificación del Profesor -->
            <aside class="teacher-id-badge">
                <div class="badge-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark" th:text="${profesor.usuario.nombre + ' ' + profesor.usuario.apellidoPaterno}">Nombre completo</h4>
                <p class="text-muted small mb-2" th:text="${profesor.numeroControl}">Número de empleado</p>
                <hr class="w-100 my-2 text-muted opacity-25">
                <span class="text-dark small fw-medium" th:text="${profesor.carreraAdscripcion.nombre}">Adscripción</span>
            </aside>

            <!-- LADO DERECHO: Hoja de Contenido Principal -->
            <section class="main-sheet">
                
                <!-- Saludo de Bienvenida e Indicador -->
                <div class="mb-4">
                    <h1 class="h2 fw-bold mb-3 text-navy" th:text="#{teacher.welcome.msg}">
                        Bienvenido/a Nombre
                    </h1>
                    
                    <div class="d-flex gap-3 flex-wrap">
                        <a th:href="@{/profesor/grupos}" class="btn btn-sky rounded-pill px-4 py-2 fw-medium shadow-sm">
                            <i class="bi bi-collection me-1"></i> <span th:text="#{profesor.inicio.btn.groups}">Ver grupos asignados</span>
                        </a>
                    </div>
                </div>

                <!-- Sección: Clases de Hoy (Invocando el fragmento) -->
                <div class="mt-5">
                    <h5 class="fw-bold text-dark mb-3" th:text="#{teacher.classes.today}">Clases de hoy</h5>
                    <div class="table-responsive">
                        <table th:replace="~{fragments/tables :: tablaClasesProfesor(${clasesHoy})}"></table>
                    </div>
                </div>

            </section>

        </div>
    </main>

    <footer th:replace="~{template :: footer}"></footer>
</body>
</html>
