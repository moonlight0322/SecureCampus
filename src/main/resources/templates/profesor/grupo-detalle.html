<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{template :: head(#{teacher.group.detail.title})}">
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
    </head>

<body class="portal-body">
    <!-- Navbar global -->
    <nav th:replace="~{template :: navbar}"></nav>
    
    <main>
        <div class="badge-wrapper">

            <!-- LADO IZQUIERDO: Credencial de Identificación del Profesor -->
            <aside class="teacher-id-badge">
                <div class="badge-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark" th:text="${profesor.nombre}">Nombre completo</h4>
                <p class="text-muted small mb-2" th:text="${profesor.numeroEmpleado}">Numero empleado</p>
                <hr class="w-100 my-2 text-muted opacity-25">
                <span class="text-secondary small fw-medium" th:text="${profesor.departamento}">Departamento</span>
            </aside>

            <!-- LADO DERECHO: Hoja de Contenido Principal -->
            <section class="teacher-main-sheet">
                <!-- En la sección principal de profesor/grupo/.html, antes del título -->
                <div class="mb-4">
                    <a th:href="@{/profesor/grupos}" class="btn btn-outline-secondary btn-sm rounded-pill mb-2 px-3">
                        <i class="bi bi-arrow-left me-1"></i> <span th:text="#{teacher.btn.back}">Regresar</span>
                    </a>
                </div>
                <!-- Cabecera -->
                <div class="d-flex justify-content-between align-items-start mb-4">
                    <div>
                        <h1 class="h2 fw-bold mb-1" th:text="${grupo.clave}">Clave del Grupo</h1>
                        <div class="d-flex gap-3 text-muted small mt-1">
                            <span class="fw-semibold text-dark" th:text="${grupo.materia}">Materia</span>
                            <span th:text="${grupo.horario}">Horario</span>
                            <span th:text="${grupo.aula}">Aula</span>
                        </div>
                    </div>
                    <div class="action-links d-flex flex-column align-items-end gap-1">
                        <button type="button" class="btn btn-link text-secondary p-0 border-0 text-decoration-none"
                                data-bs-toggle="modal" data-bs-target="#modalImprimir">
                            <i class="bi bi-printer me-1"></i> <span th:text="#{teacher.group.btn.print}">Imprimir lista</span>
                        </button>
                        <button type="button" class="btn btn-link text-primary p-0 border-0 fw-medium text-decoration-none"
                                data-bs-toggle="modal" data-bs-target="#modalEditarCalificaciones">
                            <i class="bi bi-pencil-square me-1"></i> <span th:text="#{teacher.group.btn.edit}">Editar calificaciones</span>
                        </button>
                    </div>
                </div>

                <!-- Tabla Dinámica de Evaluaciones -->
                <div class="table-responsive flex-grow-1 mt-2">
                    <table class="table align-middle table-bordered border-light bg-white rounded-3 overflow-hidden table-custom-header">
                        <thead>
                            <tr>
                                <th class="py-3 px-3" th:text="#{teacher.table.student.id}">Número control</th>
                                <th class="py-3 px-3" th:text="#{teacher.table.student.name}">Nombre del estudiante</th>
                                <!-- Generación dinámica de columnas según las evaluaciones de la BD -->
                                <th class="text-center py-3" th:each="evaluacion : ${listaEvaluaciones}" th:text="${evaluacion}">Evaluación</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="alumno : ${listaAlumnos}">
                                <td class="fw-semibold text-secondary" th:text="${alumno.numeroControl}">21211001</td>
                                <td class="fw-medium" th:text="${alumno.nombre}">Nombre del estudiante</td>
                                <!-- Generación dinámica de celdas con la calificación correspondiente -->
                                <td class="text-center" th:each="calificacion : ${alumno.calificaciones}" th:text="${calificacion}">--</td>
                            </tr>
                            <tr th:if="${listaAlumnos == null or listaAlumnos.empty}">
                                <td colspan="100" class="text-center text-muted py-4">No hay alumnos inscritos en este grupo.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </section>

        </div>
    </main>

    <!-- Modales del profesor -->
    <div th:replace="~{fragments/components :: modalImprimir}"></div>
    <div th:replace="~{fragments/components :: modalEditarCalificaciones}"></div>

    <footer th:replace="~{template :: footer}"></footer>

    <!-- Después del footer, porque necesita Bootstrap JS ya cargado -->
    <th:block th:replace="~{fragments/components :: scriptsModalesProfesor}"></th:block>
</body>
