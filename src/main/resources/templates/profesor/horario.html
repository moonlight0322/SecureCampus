<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" class="h-100">
    <head th:replace="~{template :: head('Horario docente | SecureCampus')}"></head>
    <body class="d-flex flex-column min-vh-100">
        <nav th:replace="~{template :: navbar}"></nav>
        <main class="flex-grow-1 py-4">
            <div class="container page-shell">
                <div th:replace="~{fragments/components :: accountBanner('Profesor', ${profesorControl})}"></div>
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div>
                        <p class="eyebrow text-uppercase text-orange fw-bold mb-1">MÓDULO DE DOCENCIA</p>
                        <h1 class="h2 fw-bold text-navy mb-1">Mi horario</h1>
                        <p class="text-secondary mb-0">Horario de las materias y grupos que tienes asignados.</p>
                    </div>
                    <a th:href="@{/profesor}" class="btn btn-outline-navy"><i class="bi bi-arrow-left me-1"></i>Volver a mis grupos</a>
                </div>
                <div th:if="${#lists.isEmpty(horario)}" class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>No hay horarios capturados para tus grupos asignados.
                </div>
                <div th:unless="${#lists.isEmpty(horario)}" class="card border-0 shadow-sm rounded-3">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr><th>Materia</th><th>Clave</th><th>Grupo</th><th>Horario</th><th>Aula</th><th>Periodo</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="clase : ${horario}">
                                    <td class="fw-semibold" th:text="${clase.materia}">Materia</td>
                                    <td th:text="${clase.clave}">Clave</td>
                                    <td th:text="${clase.grupo}">Grupo</td>
                                    <td th:text="${clase.horario}">Horario</td>
                                    <td th:text="${clase.salon}">Aula</td>
                                    <td th:text="${clase.periodo}">Periodo</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="~{template :: footer}"></footer>
    </body>
</html>
