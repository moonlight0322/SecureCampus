<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{template :: head('Recuperación de Contraseña | Instituto Tecnológico de Toluca')}"></head>
    <body class="login-page">
        <main class="container min-vh-100 d-flex align-items-center py-4 py-lg-5">
            <div class="row login-layout w-100 align-items-center justify-content-center mx-auto">
                <section class="col-12 col-md-6 col-lg-5">
                    <div class="login-card">
                        <div class="brand-mark mb-4">
                            <i class="bi bi-key-fill"></i>
                        </div>
                        <p class="eyebrow mb-2">SEGURIDAD INSTITUCIONAL</p>
                        <h2 class="h3 fw-bold mb-2">Recuperar acceso</h2>
                        <p class="text-secondary mb-4">
                            La recuperación por correo aún no está habilitada. Para recuperar tu acceso, solicita el restablecimiento al administrador escolar.
                        </p>

                        <div th:if="${mensaje != null}" class="alert alert-info" role="alert">
                            <i class="bi bi-info-circle-fill me-2"></i>
                            <span th:text="${mensaje}"></span>
                        </div>

                        <div class="mt-4 text-center">
                            <a th:href="@{/login}" class="text-decoration-none small">
                                <i class="bi bi-arrow-left me-1"></i>Volver al inicio de sesión
                            </a>
                        </div>
                    </div>
                </section>
            </div>
        </main>
        <footer th:replace="~{template :: footer}"></footer>
    </body>
</html>
