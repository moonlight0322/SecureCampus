<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" class="h-100">
  <head th:with="pageTitle='Cambiar Contraseña'">
    <head th:replace="~{template :: head(${pageTitle})}"></head>
  </head>
  <body class="d-flex flex-column min-vh-100 portal-body">
    <!-- Barra de navegación superior del sistema -->
    <nav th:replace="~{template :: navbar}"></nav>

    <!-- Contenido principal centrado -->
    <main class="flex-grow-1 py-4 d-flex align-items-center">
      <div
        class="container px-4 page-shell my-auto w-100"
        style="max-width: 600px"
      >
        <div class="card shadow-sm border-0 p-4">
          <h3 class="mb-4 text-navy fw-bold">
            <i class="bi bi-shield-lock-fill me-2"></i>Cambiar Contraseña
          </h3>

          <!-- Alertas de éxito o error devueltas por el controlador -->
          <div
            th:if="${exito}"
            class="alert alert-success alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${exito}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>

          <div
            th:if="${error}"
            class="alert alert-danger alert-dismissible fade show"
            role="alert"
          >
            <span th:text="${error}"></span>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="alert"
              aria-label="Close"
            ></button>
          </div>

          <!-- Formulario de cambio de contraseña -->
          <form th:action="@{/cambiar-password}" method="post">
            <div class="mb-3">
              <label for="passwordActual" class="form-label fw-semibold"
                >Contraseña Actual:</label
              >
              <input
                type="password"
                id="passwordActual"
                name="passwordActual"
                class="form-control"
                required
              />
            </div>

            <div class="mb-4">
              <label for="passwordNueva" class="form-label fw-semibold"
                >Nueva Contraseña:</label
              >
              <input
                type="password"
                id="passwordNueva"
                name="passwordNueva"
                class="form-control"
                required
              />
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i>Guardar Nueva Contraseña
              </button>
              <a th:href="@{/acceso}" class="text-decoration-none text-muted">
                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
              </a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
