<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <head th:replace="~{template :: head('Cárdex - Portal de Alumnos')}"></head>
  </head>
  <body class="portal-body">
    <!-- Navbar global -->
    <nav th:replace="~{template :: navbar}"></nav>

    <main>
      <div class="badge-wrapper">
        <!-- LADO IZQUIERDO: Credencial de Identificación del estudiante -->
        <aside class="student-id-badge">
          <div class="badge-avatar">
            <i class="bi bi-person-fill"></i>
          </div>
          <h4
            class="fw-bold mb-1 text-dark"
            th:text="${estudiante.nombreCompleto}"
          >
            Nombre completo
          </h4>
          <p
            class="text-muted small mb-2"
            th:text="${estudiante.numeroControl}"
          >
            Número de control
          </p>
          <hr class="w-100 my-2 text-muted opacity-25" />
          <span
            class="text-dark small fw-medium"
            th:text="${estudiante.carrera}"
            >Carrera</span
          >

          <!-- Botón de Cambiar Contraseña (fuera de la credencial) -->
          <div class="mt-3 px-2">
            <div
              th:replace="~{fragments/components :: botonCambiarPassword}"
            ></div>
          </div>
        </aside>

        <!-- LADO DERECHO: Hoja de Contenido Principal -->
        <section class="main-sheet">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 fw-bold mb-0 text-dark">Cárdex</h1>
            <a
              th:href="@{/estudiante}"
              class="btn btn-outline-secondary btn-sm rounded-pill px-3"
            >
              <i class="bi bi-arrow-left me-1"></i> Volver al inicio
            </a>
          </div>

          <!-- Tabla de Kárdex -->
          <div class="mt-3">
            <div
              th:if="${#lists.isEmpty(materias)}"
              class="text-center text-muted py-4"
            >
              No hay registros académicos disponibles en el cárdex.
            </div>

            <div th:if="${!#lists.isEmpty(materias)}" class="table-responsive">
              <table
                th:replace="~{fragments/tables :: tablaKardex(${materias})}"
              ></table>
            </div>

            <p class="small text-muted mt-3">
              * El tipo de oportunidad se muestra según el registro académico de
              cada inscripción.
            </p>
          </div>
        </section>
      </div>
    </main>

    <footer th:replace="~{template :: footer}"></footer>
  </body>
</html>
