<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head
        th:replace="~{fragments/layout :: head('Mi horario | Portal académico')}"
    ></head>
    <body>
        <div th:replace="~{fragments/layout :: navbar('horario')}"></div>

        <main class="container page-shell py-4 py-lg-5">
            <div
                th:replace="~{fragments/components
            :: pageHeadingWithAction(
                'ESPACIO DEL ESTUDIANTE',
                'Mi horario',
                'Materias inscritas en el periodo escolar vigente.',
                '/estudiante/kardex',
                'Ir al kárdex',
                'journal-check'
            )}"
            ></div>

            <section class="content-card table-card">
                <div
                    th:if="${#lists.isEmpty(materias)}"
                    th:replace="~{fragments/components
                    :: emptyState('calendar2-x', 'No hay materias inscritas en un periodo vigente.')}"
                ></div>
                <div
                    th:replace="~{fragments/tables :: tablaHorario(${materias})}"
                ></div>
            </section>

            <a
                class="btn btn-link link-navy ps-0 mt-3"
                th:href="@{/estudiante}"
            >
                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
            </a>
        </main>

        <div th:replace="~{fragments/layout :: footer}"></div>
    </body>
</html>
