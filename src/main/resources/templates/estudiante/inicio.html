<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head
        th:replace="~{fragments/layout :: head('Inicio | Portal académico')}"
    ></head>
    <body>
        <div th:replace="~{fragments/layout :: navbar('inicio')}"></div>

        <main class="container page-shell py-4 py-lg-5">
            <div
                th:replace="~{fragments/components
            :: pageHeading(
                'ESPACIO DEL ESTUDIANTE',
                'Bienvenido/a, ' + ${estudiante.nombreCompleto},
                'Aquí tienes un resumen de tu actividad académica.'
            )}"
            ></div>

            <section
                th:replace="~{fragments/components
            :: profileBanner(
                ${estudiante.nombreCompleto},
                ${estudiante.numeroControl},
                ${estudiante.carrera},
                ${estudiante.promedio}
            )}"
            ></section>

            <div class="row g-4">
                <section class="col-12 col-lg-7">
                    <div class="content-card h-100">
                        <div
                            class="d-flex justify-content-between align-items-center mb-3"
                        >
                            <div>
                                <p class="eyebrow mb-1">PERIODO ACTUAL</p>
                                <h2 class="h5 section-title mb-0">
                                    Mi horario
                                </h2>
                            </div>
                            <a
                                class="btn btn-outline-navy btn-sm"
                                th:href="@{/estudiante/horario}"
                                >Ver horario</a
                            >
                        </div>

                        <div
                            th:if="${#lists.isEmpty(materias)}"
                            th:replace="~{fragments/components
                            :: emptyState('calendar2-x', 'No hay materias inscritas en un periodo vigente.')}"
                        ></div>

                        <div
                            class="schedule-preview"
                            th:each="materia : ${materias}"
                        >
                            <span class="schedule-icon"
                                ><i class="bi bi-calendar-week"></i
                            ></span>
                            <div class="flex-grow-1">
                                <h3
                                    class="h6 fw-semibold mb-1"
                                    th:text="${materia.materia}"
                                >
                                    Materia
                                </h3>
                                <p class="schedule-meta mb-0">
                                    <span th:text="${materia.horario}"
                                        >Horario</span
                                    >
                                    <span class="mx-1">·</span>
                                    <span th:text="${materia.salon}"
                                        >Salón</span
                                    >
                                </p>
                            </div>
                        </div>

                        <a
                            th:if="${!#lists.isEmpty(materias)}"
                            class="btn btn-link link-navy p-0 mt-2 align-self-start"
                            th:href="@{/estudiante/horario}"
                        >
                            Consultar todos los detalles
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </section>

                <section class="col-12 col-lg-5">
                    <a
                        class="content-card dashboard-card h-100 text-reset"
                        th:href="@{/estudiante/kardex}"
                    >
                        <div class="student-feature-icon">
                            <i class="bi bi-journal-check"></i>
                        </div>
                        <p class="eyebrow mt-3 mb-1">HISTORIAL ACADÉMICO</p>
                        <h2 class="h5 section-title">Consulta tu kárdex</h2>
                        <p class="text-secondary">
                            Revisa las materias cursadas, calificaciones,
                            estatus y tipo de oportunidad.
                        </p>
                        <span class="btn btn-orange mt-auto align-self-start">
                            Abrir kárdex <i class="bi bi-arrow-right ms-1"></i>
                        </span>
                    </a>
                </section>
            </div>
        </main>

        <div th:replace="~{fragments/layout :: footer}"></div>
    </body>
</html>
