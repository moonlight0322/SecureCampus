<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <head th:replace="~{template :: head('Inicio - Portal de Alumnos')}"></head>
</head>
<body class="portal-body">
    <!-- Navbar global -->
    <nav th:replace="~{template :: navbar}"></nav>
    
    <main>
        <div class="badge-wrapper">

            <!-- LADO IZQUIERDO: Credencial de Identificación del estudiante -->
            <aside class="student-id-badge"> <!-- Reutilizamos el contenedor estético del gafete -->
                <div class="badge-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark" th:text="${estudiante.nombre}">Nombre completo</h4>
                <p class="text-muted small mb-2" th:text="${estudiante.numeroControl}">Número de control</p>
                <hr class="w-100 my-2 text-muted opacity-25">
                <span class="text-secondary small fw-medium" th:text="${estudiante.carrera}">Carrera</span>
            </aside>

            <!-- LADO DERECHO: Hoja de Contenido Principal -->
            <section class="main-sheet">
                
                <!-- Saludo de Bienvenida -->
                <div class="mb-4">
                    <h1 class="h2 fw-bold mb-3" th:text="#{teacher.welcome.msg(${estudiante.nombre})}">
                        Bienvenido/a Nombre
                    </h1>
                    
                    <!-- Botones de Acción Rápida -->
                    <div class="d-flex gap-3">
                        <a th:href="@{/estudiante/horario}" class="btn btn-sky rounded-pill px-4 py-2 fw-medium shadow-sm">
                            <i class="bi bi-calendar-week me-1"></i> Ver horario
                        </a>
                        <a th:href="@{/estudiante/kardex}" class="btn btn-sky rounded-pill px-4 py-2 fw-medium shadow-sm">
                            <i class="bi bi-journal-text me-1"></i> Ver cárdex
                        </a>
                    </div>
                </div>

                <!-- Sección: Clases de Hoy -->
                <div class="mt-4">
                    <h5 class="fw-bold text-dark mb-3">Clases de hoy</h5>
                    
                    <div class="table-responsive">
                        <table class="table align-middle table-bordered border-light bg-white rounded-3 overflow-hidden table-custom-header">
                            <thead>
                                <tr>
                                    <th class="py-3 px-3 text-center" style="width: 25%;">Hora</th>
                                    <th class="py-3 px-3" style="width: 55%;">Materia</th>
                                    <th class="py-3 px-3 text-center" style="width: 20%;">Aula</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="clase : ${clasesHoy}">
                                    <td class="text-center fw-semibold text-secondary" th:text="${clase.hora}">07:00 - 09:00</td>
                                    <td class="fw-medium text-dark" th:text="${clase.materia}">Sistemas Operativos</td>
                                    <td class="text-center text-muted" th:text="${clase.aula}">Lab 3</td>
                                </tr>
                                <tr th:if="${clasesHoy == null or clasesHoy.empty}">
                                    <td colspan="3" class="text-center text-muted py-4">No hay clases programadas para el día de hoy.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </section>

        </div>
    </main>

    <footer th:replace="~{template :: footer}"></footer>
</body>
</html>
