<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:with="pageTitle=#{estudiante.solicitudes.pagetitle}">
        <head th:replace="~{template :: head(${pageTitle})}"></head>
    </head>
<body class="portal-body">
    <!-- Navbar global -->
    <nav th:replace="~{template :: navbar}"></nav>
    
    <main>
        <div class="badge-wrapper">

            <!-- LADO IZQUIERDO: Credencial de Identificación del estudiante -->
            <aside class="student-id-badge">
                <div class="badge-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark" th:text="${estudiante.nombre}">Nombre completo</h4>
                <p class="text-muted small mb-2" th:text="${estudiante.numeroControl}">Número de control</p>
                <hr class="w-100 my-2 text-muted opacity-25">
                <span class="text-dark small fw-medium" th:text="${estudiante.carrera}">Carrera</span>
            </aside>

            <!-- LADO DERECHO: Hoja de Contenido Principal -->
            <section class="main-sheet">
                
                <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                    <div>
                        <h1 class="h3 fw-bold mb-1 text-dark" th:text="#{estudiante.solicitudes.maintitle}">Trámites Escolares Digitales</h1>
                        
                    </div>
                    <a th:href="@{/estudiante/inicio}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> <span th:text="#{estudiante.horario.btn.back}">Volver al inicio</span>
                    </a>
                </div>

                <div th:if="${param.creada != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <span th:text="#{estudiante.solicitudes.alert.success}">Tu solicitud ha sido registrada exitosamente con folio único.</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Historial de Solicitudes (Invocando fragmento de tabla) -->
                <div class="table-responsive mt-3">
                    <table th:replace="~{fragments/tables :: tablaSolicitudes(${solicitudes})}"></table>
                </div>
                <button type="button" class="btn btn-orange rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#modalNuevaSolicitud">
                    <i class="bi bi-plus-circle me-1"></i><span th:text="#{estudiante.solicitudes.btn.new}">Nueva Solicitud</span>
                </button>

            </section>

        </div>
    </main>

    <!-- Modal Nueva Solicitud (Invocando fragmento de componente) -->
    <div th:replace="~{fragments/components :: modalNuevaSolicitud}"></div>

    <footer th:replace="~{template :: footer}"></footer>
</body>
</html>
