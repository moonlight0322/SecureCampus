<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head
        th:replace="~{fragments/layout :: head('Mi kárdex | Portal académico')}"
    ></head>
    <body>
        <div th:replace="~{fragments/layout :: navbar('kardex')}"></div>

        <main class="container page-shell py-4 py-lg-5">
            <div
                th:replace="~{fragments/components
            :: pageHeadingWithAction(
                'ESPACIO DEL ESTUDIANTE',
                'Mi kárdex',
                'Historial de materias, calificaciones y oportunidades registradas.',
                '/estudiante/horario',
                'Ir al horario',
                'calendar-week'
            )}"
            ></div>

            <section class="content-card table-card">
                <div
                    th:if="${#lists.isEmpty(materias)}"
                    th:replace="~{fragments/components
                    :: emptyState('journal-x', 'Aún no hay materias registradas en tu kárdex.')}"
                ></div>
                <div
                    th:replace="~{fragments/tables :: tablaKardex(${materias})}"
                ></div>

                <p class="small text-secondary mb-0 mt-3">
                    El tipo de oportunidad se muestra según el registro
                    académico de cada inscripción.
                </p>
            </section>

            <a
                class="btn btn-link link-navy ps-0 mt-3"
                th:href="@{/estudiante}"
            >
                <i class="bi bi-arrow-left me-1"></i>Volver al inicio
            </a>
        </main>

        <div th:replace="~{fragments/layout :: footer}"></div>
    </body>
</html>
