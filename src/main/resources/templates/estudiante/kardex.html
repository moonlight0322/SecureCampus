<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" class="h-100">
    <head th:replace="~{template :: head(#{meta.title.kardex})}"></head>
    <body class="d-flex flex-column min-vh-100">
        <nav th:replace="~{template :: navbar}"></nav>

        <main class="flex-grow-1 py-4 d-flex align-items-center">
            <div class="container-fluid px-4 page-shell my-auto">
                <div class="binder-wrapper">
                    <!-- LADO IZQUIERDO: Portada del Binder -->
                    <div class="binder-sidebar">
                        <div class="binder-tabs">
                            <a
                                th:href="@{/estudiante}"
                                class="binder-tab tab-yellow"
                                th:attr="title=#{binder.tab.profile}"
                            >
                                <i class="bi bi-person-badge-fill"></i>
                                <span
                                    class="tab-label"
                                    th:text="#{binder.tab.profile}"
                                    >Perfil</span
                                >
                            </a>
                            <a
                                th:href="@{/estudiante/horario}"
                                class="binder-tab tab-orange"
                                th:attr="title=#{binder.tab.schedule}"
                            >
                                <i class="bi bi-calendar-week-fill"></i>
                                <span
                                    class="tab-label"
                                    th:text="#{binder.tab.schedule}"
                                    >Horario</span
                                >
                            </a>
                            <a
                                th:href="@{/estudiante/kardex}"
                                class="binder-tab tab-teal active"
                                th:attr="title=#{binder.tab.kardex}"
                            >
                                <i class="bi bi-journal-bookmark-fill"></i>
                                <span
                                    class="tab-label"
                                    th:text="#{binder.tab.kardex}"
                                    >Kárdex</span
                                >
                            </a>
                        </div>

                        <div class="folder-cover">
                            <div
                                class="folder-content d-flex flex-column h-100"
                            >
                                <div class="student-avatar-box mb-3">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                                <h3
                                    class="student-name mb-1"
                                    th:text="${estudiante.nombreCompleto}"
                                >
                                    Nombre del alumno
                                </h3>
                                <p class="student-control text-muted mb-2">
                                    <i class="bi bi-card-heading me-1"></i>
                                    <span
                                        class="text-black"
                                        th:text="${estudiante.numeroControl}"
                                        >No. control</span
                                    >
                                </p>
                                <span
                                    class="text-black w-100 text-truncate mb-3"
                                    style="font-size: 0.8rem"
                                    th:text="${estudiante.carrera}"
                                    >Carrera</span
                                >
                            </div>
                        </div>
                    </div>

                    <!-- LADO DERECHO: Tabla de Kárdex -->
                    <div class="binder-content-sheet d-flex flex-column">
                        <div
                            th:replace="~{fragments/components :: pageTitle(#{kardex.heading.title})}"
                        ></div>

                        <div
                            th:if="${#lists.isEmpty(materias)}"
                            th:replace="~{fragments/components :: emptyState('journal-x', #{kardex.empty})}"
                        ></div>

                        <div
                            th:if="${!#lists.isEmpty(materias)}"
                            class="table-responsive table-card rounded-3 border"
                        >
                            <table
                                th:replace="~{fragments/tables :: tablaKardex(${materias})}"
                            ></table>
                        </div>

                        <p
                            class="small text-secondary mb-0 mt-3"
                            th:text="#{kardex.hint}"
                        >
                            El tipo de oportunidad se muestra según el registro
                            académico de cada inscripción.
                        </p>

                        <div class="mt-auto pt-3">
                            <a
                                class="btn btn-link link-navy ps-0"
                                th:href="@{/estudiante}"
                            >
                                <i class="bi bi-arrow-left me-1"></i
                                ><span th:text="#{schedule.back}"
                                    >Volver al inicio</span
                                >
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{template :: footer}"></footer>
    </body>
</html>
