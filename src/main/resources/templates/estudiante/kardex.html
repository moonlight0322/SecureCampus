<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" class="h-100">
    <head th:replace="~{template :: head(#{meta.title.kardex})}"></head>
    <body class="d-flex flex-column min-vh-100">
        <nav th:replace="~{template :: navbar}"></nav>

        <main class="flex-grow-1 py-4 d-flex align-items-center">
            <div class="container-fluid px-4 page-shell my-auto">
                <div class="badge-wrapper">
                    <aside th:replace="~{fragments/components :: studentBadge('kardex', ${estudiante})}"></aside>
                    <section class="main-sheet">
                        <div
                            th:replace="~{fragments/components :: pageTitle(#{kardex.heading.title})}"
                        ></div>

                        <div
                            th:if="${#lists.isEmpty(materias)}"
                            th:replace="~{fragments/components :: emptyState('journal-x', #{kardex.empty})}"
                        ></div>

                        <div
                            th:if="${!#lists.isEmpty(materias)}"
                            class="table-responsive table-card rounded-3 border"
                        >
                            <table
                                th:replace="~{fragments/tables :: tablaKardex(${materias})}"
                            ></table>
                        </div>

                        <p
                            class="small text-secondary mb-0 mt-3"
                            th:text="#{kardex.hint}"
                        >
                            El tipo de oportunidad se muestra según el registro
                            académico de cada inscripción.
                        </p>

                        <div class="mt-auto pt-3">
                            <a
                                class="btn btn-link link-navy ps-0"
                                th:href="@{/estudiante}"
                            >
                                <i class="bi bi-arrow-left me-1"></i
                                ><span th:text="#{schedule.back}"
                                    >Volver al inicio</span
                                >
                            </a>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer th:replace="~{template :: footer}"></footer>
    </body>
</html>
