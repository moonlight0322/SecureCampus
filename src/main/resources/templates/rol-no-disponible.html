<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{template :: head('Acceso | Instituto Tecnológico de Toluca')}"></head>
<body>
    <main class="container min-vh-100 d-flex align-items-center justify-content-center">
        <section class="text-center bg-white rounded-4 shadow-sm p-5">
            <div class="brand-mark mx-auto mb-4"><i class="bi bi-person-lock"></i></div>
            <p class="eyebrow">INSTITUTO TECNOLÓGICO DE TOLUCA</p>
            <h1 class="h3 fw-bold">Módulo no disponible</h1>
            <p class="text-secondary">Tu cuenta fue autenticada, pero este portal solo incluye el espacio del estudiante.</p>
            <form th:action="@{/logout}" method="post">
                <button class="btn btn-orange" type="submit">Cerrar sesión</button>
            </form>
        </section>
    </main>
</body>
</html>
