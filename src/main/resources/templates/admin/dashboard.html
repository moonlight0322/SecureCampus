<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" class="h-100">
    <head th:with="pageTitle=#{admin.dashboard.pagetitle}">
        <head th:replace="~{template :: head(${pageTitle})}"></head>
    </head>
    <body class="d-flex flex-column min-vh-100 portal-body">
        <nav th:replace="~{template :: navbar}"></nav>

        <main class="flex-grow-1 py-4 d-flex align-items-center">
            <div class="container-fluid px-4 page-shell my-auto w-100">
                <div class="binder-wrapper">
                    
                    <!-- LADO IZQUIERDO: Portada del Binder (Expediente Administrativo) -->
                    <div class="binder-sidebar">
                        <div class="binder-tabs">
                            <a th:href="@{/admin/dashboard}" class="binder-tab tab-yellow active" th:title="#{admin.dashboard.tab.panel}">
                                <i class="bi bi-folder-fill"></i>
                                <span class="tab-label" th:text="#{admin.dashboard.tab.panel.label}">Expediente</span>
                            </a>
                        </div>

                        <div class="folder-cover">
                            <div class="folder-content d-flex flex-column h-100">
                                <div class="student-avatar-box mb-3">
                                    <i class="bi bi-person-workspace"></i>
                                </div>
                                <h3 class="student-name mb-1" th:text="${administrativo.nombre}">Nombre del Administrador</h3>
                                <p class="student-control text-muted mb-2">
                                    <i class="bi bi-shield-lock-fill me-1"></i>
                                    <span class="text-black" th:text="${administrativo.empleadoId}">No. Empleado</span>
                                </p>
                                <span class="text-black w-100 text-truncate mb-3" style="font-size: 0.8rem" th:text="${administrativo.departamento}">Departamento</span>
                            </div>
                        </div>
                    </div>

                    <!-- LADO DERECHO: Lienzo de Contenido Ejecutivo -->
                    <div class="binder-content-sheet">
                        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                            <div>
                                <p class="eyebrow text-uppercase text-orange fw-bold mb-1" th:text="#{admin.dashboard.eyebrow}">MÓDULO DE CONTROL CENTRAL</p>
                                <h1 class="h2 fw-bold text-navy mb-1" th:text="#{admin.dashboard.maintitle}">Panel de Administración y Seguridad</h1>
                                <p class="text-secondary mb-0" th:text="#{admin.dashboard.subtitle}">Gestión de identidades, control RBAC, asignaciones escolares y bitácora de auditoría.</p>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-navy" data-bs-toggle="modal" data-bs-target="#modalNuevoUsuario">
                                    <i class="bi bi-person-plus-fill me-1"></i><span th:text="#{admin.dashboard.btn.newuser}">Nuevo Usuario</span>
                                </button>
                                <button type="button" class="btn btn-orange" data-bs-toggle="modal" data-bs-target="#modalAsignarGrupo">
                                    <i class="bi bi-diagram-3-fill me-1"></i><span th:text="#{admin.dashboard.btn.assigngroup}">Asignar Grupo</span>
                                </button>
                            </div>
                        </div>

                        <!-- Nav Tabs del Administrador -->
                        <ul class="nav nav-pills mb-4" id="adminTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="usuarios-tab" data-bs-toggle="pill" data-bs-target="#tab-usuarios" type="button" role="tab">
                                    <i class="bi bi-people-fill me-1"></i><span th:text="#{admin.dashboard.tab.users}">Usuarios y Roles</span>
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="solicitudes-tab" data-bs-toggle="pill" data-bs-target="#tab-solicitudes" type="button" role="tab">
                                    <i class="bi bi-inbox-fill me-1"></i><span th:text="#{admin.dashboard.tab.requests}">Trámites y Desbloqueos</span>
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="auditoria-tab" data-bs-toggle="pill" data-bs-target="#tab-auditoria" type="button" role="tab">
                                    <i class="bi bi-shield-lock-fill me-1"></i><span th:text="#{admin.dashboard.tab.audit}">Auditoría y Logs</span>
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content" id="adminTabsContent">
                            <!-- TAB 1: USUARIOS -->
                            <div class="tab-pane fade show active" id="tab-usuarios" role="tabpanel">
                                <div class="card shadow-sm border-0 rounded-3">
                                    <div class="card-body p-0 table-responsive">
                                        <table th:replace="~{fragments/tables :: tablaAdminUsuarios(${usuarios})}"></table>
                                    </div>
                                </div>
                            </div>

                            <!-- TAB 2: SOLICITUDES / TICKETS -->
                            <div class="tab-pane fade" id="tab-solicitudes" role="tabpanel">
                                <div class="card shadow-sm border-0 rounded-3">
                                    <div class="card-body p-0 table-responsive">
                                        <table th:replace="~{fragments/tables :: tablaAdminSolicitudes(${solicitudes})}"></table>
                                    </div>
                                </div>
                            </div>

                            <!-- TAB 3: AUDITORÍA Y LOGS -->
                            <div class="tab-pane fade" id="tab-auditoria" role="tabpanel">
                                <div class="card shadow-sm border-0 rounded-3">
                                    <div class="card-body p-0 table-responsive">
                                        <table th:replace="~{fragments/tables :: tablaAdminLogs(${logs})}"></table>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </main>

        <!-- Modales -->
        <div th:replace="~{fragments/components :: modalNuevoUsuario(${roles})}"></div>
        <div th:replace="~{fragments/components :: modalAsignarGrupo(${materias}, ${profesores}, ${periodos})}"></div>
        <div th:replace="~{fragments/components :: modalesResolverSolicitudes(${solicitudes})}"></div>

        <footer th:replace="~{template :: footer}"></footer>
    </body>
</html>
