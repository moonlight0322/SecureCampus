<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" class="h-100">
    <head th:fragment="head(titulo)">
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title th:text="${titulo}">Portal académico</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" th:href="@{/css/portal.css(v=5)}" />
        <link
            rel="icon"
            type="image/svg+xml"
            th:href="@{/images/favicon.svg}"
        />
        <script
            defer
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        ></script>
    </head>
    <body class="d-flex flex-column min-vh-100">
        <!-- Navbar Minimalista (Brand + Logout) -->
        <nav
            th:fragment="navbar"
            class="navbar portal-navbar sticky-top shadow-sm py-2"
        >
            <div class="container-fluid px-4">
                <a
                    class="navbar-brand d-flex align-items-center gap-3 py-1"
                    th:href="@{/estudiante}"
                >
                    <span
                        class="brand-mini d-flex align-items-center justify-content-center rounded-circle bg-white text-navy p-2 shadow-sm"
                        style="width: 40px; height: 40px"
                    >
                        <i class="bi bi-mortarboard-fill fs-5"></i>
                    </span>
                    <span class="d-flex flex-column">
                        <strong
                            class="lh-sm text-white"
                            th:text="#{institution.name}"
                            style="font-size: 0.95rem"
                        ></strong>
                        <small
                            class="d-block text-white-50 lh-1 mt-1"
                            th:text="#{app.portal.name}"
                            style="font-size: 0.8rem"
                        ></small>
                    </span>
                </a>

                <form th:action="@{/logout}" method="post" class="m-0 ms-auto">
                <div class="accessibility-bar ms-auto me-3 d-none d-md-flex">
                    <button type="button" class="btn-accessibility" onclick="toggleDarkMode()" title="Modo Oscuro">
                        <i class="bi bi-moon-stars-fill"></i>
                    </button>
                    <button type="button" class="btn-accessibility" onclick="toggleContrast()" title="Alto Contraste">
                        <i class="bi bi-circle-half"></i>
                    </button>
                    <button type="button" class="btn-accessibility" onclick="toggleFontSize()" title="Tamaño de Letra">
                        <i class="bi bi-fonts"></i>
                    </button>
                </div>

                <form th:action="@{/logout}" method="post" class="m-0">
                    <button
                        class="btn btn-outline-light btn-sm d-inline-flex align-items-center gap-2 px-3 py-2 rounded-3"
                        type="submit"
                    >
                        <i class="bi bi-box-arrow-right"></i>
                        <span th:text="#{btn.logout}">Cerrar sesión</span>
                    </button>
                </form>
            </div>
        </nav>

        <!-- Main Workspace -->
        <main class="flex-grow-1 py-4">
            <!-- El contenido del expediente / folder se renderiza en cada vista -->
        </main>

        <!-- Footer con Easter Egg -->
        <footer
            th:fragment="footer"
            class="portal-footer py-3 mt-auto border-top bg-white text-secondary"
        >
            <div
                class="container-fluid px-4 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 text-center text-sm-start small"
            >
                <div>
                    <span class="mx-1" th:text="#{footer.copyright}"></span>
                    <span class="mx-1">·</span>
                    <span
                        class="easter-egg text-muted ml-3"
                        style="font-size: 0.5rem"
                        th:text="#{footer.easteregg}"
                        >Hecho con amor, para aprender de Desarrollo Seguro
                        :D</span
                    >
                </div>
                <span class="text-muted" th:text="#{app.portal.subtitle}"
                    >Portal académico estudiantil</span
                >
            </div>
        </footer>

        <script>
            function applySavedAccessibility() {
                if (localStorage.getItem('sc_dark_mode') === 'true') document.body.classList.add('dark-mode');
                if (localStorage.getItem('sc_contrast') === 'true') document.body.classList.add('high-contrast');
                if (localStorage.getItem('sc_font_large') === 'true') document.body.classList.add('font-large');
            }
            function toggleDarkMode() {
                const active = document.body.classList.toggle('dark-mode');
                localStorage.setItem('sc_dark_mode', active);
            }
            function toggleContrast() {
                const active = document.body.classList.toggle('high-contrast');
                localStorage.setItem('sc_contrast', active);
            }
            function toggleFontSize() {
                const active = document.body.classList.toggle('font-large');
                localStorage.setItem('sc_font_large', active);
            }
            document.addEventListener('DOMContentLoaded', applySavedAccessibility);
        </script>
    </body>
</html>
