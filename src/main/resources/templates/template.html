<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" class="h-100">
  <head th:fragment="head(titulo)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${titulo}">Portal académico</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/portal.css(v=7)}" />
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Navbar Minimalista (Brand + Logout) -->
    <th:block th:fragment="navbar">
      <nav class="navbar portal-navbar sticky-top shadow-sm py-2">
      <div class="container-fluid px-4">
        <a
          class="navbar-brand d-flex align-items-center gap-3 py-1"
          th:href="@{/acceso}"
        >
          <span
            class="brand-mini d-flex align-items-center justify-content-center rounded-circle bg-white text-navy p-2 shadow-sm"
            style="width: 40px; height: 40px"
          >
            <i class="bi bi-mortarboard-fill fs-5"></i>
          </span>
          <span class="d-flex flex-column">
            <strong
              class="lh-sm text-white"
              th:text="#{institution.name}"
              style="font-size: 0.95rem"
            ></strong>
            <small
              class="d-block text-white-50 lh-1 mt-1"
              th:text="#{app.portal.name}"
              style="font-size: 0.8rem"
            ></small>
          </span>
        </a>

        <div class="d-flex align-items-center gap-2 ms-auto">
          <!-- Botón Campanita de Notificaciones -->
          <button
            type="button"
            class="btn btn-outline-light btn-sm position-relative d-inline-flex align-items-center justify-content-center p-2 rounded-circle"
            data-bs-toggle="modal"
            data-bs-target="#modalNotificacionesFlotante"
            title="Avisos y notificaciones"
            style="width: 36px; height: 36px"
          >
            <i class="bi bi-bell-fill"></i>
            <span
              th:if="${totalNotificacionesNoLeidas != null and totalNotificacionesNoLeidas > 0}"
              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light"
              style="font-size: 0.65rem;"
              th:text="${totalNotificacionesNoLeidas}"
            >
              1
            </span>
          </button>

          <a
            class="btn btn-outline-light btn-sm"
            th:href="@{/cuenta/contrasena}"
            title="Cambiar contraseña"
          >
            <i class="bi bi-key-fill me-sm-1"></i
            ><span class="d-none d-sm-inline">Contraseña</span>
          </a>
          <div
            class="accessibility-bar d-flex gap-1"
            role="group"
            aria-label="Opciones de accesibilidad"
          ></div>
          <form th:action="@{/logout}" method="post" class="m-0">
            <button
              class="btn btn-outline-light btn-sm d-inline-flex align-items-center gap-2 px-3 py-2 rounded-3"
              type="submit"
            >
              <i class="bi bi-box-arrow-right"></i>
              <span class="d-none d-sm-inline" th:text="#{btn.logout}"
                >Cerrar sesión</span
              >
            </button>
          </form>
        </div>
      </div>
    </nav>

    <!-- Modal Emergente de Notificaciones (Accesible desde la campanita) -->
    <div
      class="modal fade"
      id="modalNotificacionesFlotante"
      tabindex="-1"
      aria-labelledby="modalNotificacionesLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content shadow-lg border-0 rounded-4">
          <div class="modal-header bg-navy text-white">
            <h5 class="modal-title fw-bold" id="modalNotificacionesLabel">
              <i class="bi bi-bell-fill text-warning me-2"></i>Notificaciones y Avisos
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body p-3">
            <div
              th:if="${notificacionesGlobales == null or notificacionesGlobales.empty}"
              class="text-center text-muted py-4"
            >
              <i class="bi bi-bell-slash fs-1 d-block mb-2 text-secondary opacity-50"></i>
              <span>No tienes avisos ni notificaciones pendientes.</span>
            </div>

            <div
              th:unless="${notificacionesGlobales == null or notificacionesGlobales.empty}"
              class="d-flex flex-column gap-2"
            >
              <div
                th:each="notif : ${notificacionesGlobales}"
                class="card border border-light-subtle rounded-3 shadow-xs p-3 position-relative"
                th:classappend="${notif.leida == 0 ? 'bg-light border-start border-4 border-warning' : 'bg-white opacity-75'}"
              >
                <div class="d-flex justify-content-between align-items-start mb-1">
                  <h6
                    class="fw-bold mb-0 text-navy"
                    style="font-size: 0.95rem"
                    th:text="${notif.titulo}"
                  >
                    Título del aviso
                  </h6>
                  <form
                    th:action="@{/notificaciones/{id}/eliminar(id=${notif.idNotificacion})}"
                    method="post"
                    class="m-0"
                  >
                    <button
                      type="submit"
                      class="btn btn-sm btn-link text-muted p-0 ms-2"
                      title="Eliminar notificación"
                      style="line-height: 1"
                    >
                      <i class="bi bi-x-lg text-danger fs-6"></i>
                    </button>
                  </form>
                </div>
                <p
                  class="small text-secondary mb-2"
                  th:text="${notif.mensaje}"
                  style="white-space: pre-wrap;"
                >
                  Mensaje
                </p>
                <div class="d-flex justify-content-between align-items-center">
                  <small
                    class="text-muted"
                    style="font-size: 0.75rem"
                    th:text="${#temporals.format(notif.fechaCreacion, 'dd/MM/yyyy HH:mm')}"
                  >
                    Fecha
                  </small>
                  <form
                    th:if="${notif.leida == 0}"
                    th:action="@{/notificaciones/{id}/marcar-leida(id=${notif.idNotificacion})}"
                    method="post"
                    class="m-0"
                  >
                    <button
                      type="submit"
                      class="btn btn-link p-0 text-decoration-none text-primary"
                      style="font-size: 0.75rem"
                    >
                      <i class="bi bi-check2-all me-1"></i>Marcar leída
                    </button>
                  </form>
                </div>
              </div>
            </div>
          </div>
          <div class="modal-footer bg-light py-2">
            <button
              type="button"
              class="btn btn-sm btn-secondary rounded-pill px-3"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
          </div>
        </div>
      </div>
    </div>
    </th:block>

    <!-- Main Workspace -->
    <main class="flex-grow-1 py-4">
      <!-- El contenido del expediente / folder se renderiza en cada vista -->
    </main>

    <!-- Footer con Easter Egg -->
    <footer
      th:fragment="footer"
      class="portal-footer py-3 mt-auto border-top bg-white text-secondary"
    >
      <div
        class="container-fluid px-4 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 text-center text-sm-start small"
      >
        <div>
          <span class="mx-1" th:text="#{footer.copyright}"></span>
          <span class="mx-1">·</span>
          <span
            class="easter-egg text-muted ml-3"
            style="font-size: 0.5rem"
            th:text="#{footer.easteregg}"
            >Hecho con amor, para aprender de Desarrollo Seguro :D</span
          >
        </div>
        <span class="text-muted" th:text="#{app.portal.subtitle}"
          >Portal académico estudiantil</span
        >
      </div>
    </footer>
  </body>
</html>
