<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Portal académico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/portal.css(v=4)}">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav th:fragment="navbar(seccion)" class="navbar navbar-expand-lg portal-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/estudiante}">
                <span class="brand-mini"><i class="bi bi-mortarboard-fill"></i></span>
                <span><strong>INSTITUTO TECNOLÓGICO DE TOLUCA</strong><small class="d-block">Portal académico</small></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#portalNav"
                    aria-controls="portalNav" aria-expanded="false" aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="portalNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'inicio'} ? ' active'"
                                            th:attr="aria-current=${seccion == 'inicio'} ? 'page'"
                                            th:href="@{/estudiante}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'horario'} ? ' active'"
                                            th:attr="aria-current=${seccion == 'horario'} ? 'page'"
                                            th:href="@{/estudiante/horario}">Horario</a></li>
                    <li class="nav-item"><a class="nav-link" th:classappend="${seccion == 'kardex'} ? ' active'"
                                            th:attr="aria-current=${seccion == 'kardex'} ? 'page'"
                                            th:href="@{/estudiante/kardex}">Kárdex</a></li>
                    <li class="nav-item ms-lg-2">
                        <form th:action="@{/logout}" method="post">
                            <button class="btn btn-outline-navy btn-sm" type="submit">
                                <i class="bi bi-box-arrow-right me-1"></i>Cerrar sesión
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <footer th:fragment="footer" class="portal-footer">
        <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2">
            <span>Instituto Tecnológico de Toluca · Tecnológico Nacional de México</span>
            <span>Portal académico estudiantil</span>
        </div>
    </footer>
</body>
</html>
