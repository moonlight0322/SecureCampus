<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <body>
        <!-- =========================================================
         TABLA DE HORARIO: tablaHorario
         Propósito: mostrar las materias inscritas del estudiante junto con
         sus datos de grupo, horario, salón, docente y periodo.
         Parámetros:
         - materias: colección de objetos con las propiedades materia, clave,
           grupo, horario, salon, profesor y periodo.
         Comportamiento:
         - La tabla solo se renderiza cuando materias no está vacía.
         - Genera una fila por cada elemento de materias.
         - Muestra el nombre de la materia y su clave en la misma celda.
         Internacionalización: utiliza las claves table.col.materia,
         table.col.grupo, table.col.horario, table.col.salon,
         table.col.docente y table.col.periodo.
         Presentación: Bootstrap table-responsive, table-hover y align-middle.
         Los atributos data-label replican el nombre de cada columna para
         permitir estilos adaptables definidos en CSS.
         
         Se invoca así:
         <div th:replace="~{fragments/tables :: tablaHorario(${materias})}"></div>
         ========================================================= -->
        <div
            th:fragment="tablaHorario(materias)"
            class="table-responsive"
            th:unless="${#lists.isEmpty(materias)}"
        >
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col" th:text="#{table.col.materia}">
                            Materia
                        </th>
                        <th scope="col" th:text="#{table.col.grupo}">Grupo</th>
                        <th scope="col" th:text="#{table.col.horario}">
                            Horario
                        </th>
                        <th scope="col" th:text="#{table.col.salon}">Salón</th>
                        <th scope="col" th:text="#{table.col.docente}">
                            Docente
                        </th>
                        <th scope="col" th:text="#{table.col.periodo}">
                            Periodo
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${materias}">
                        <td th:attr="data-label=#{table.col.materia}">
                            <strong th:text="${m.materia}">Materia</strong
                            ><small
                                class="d-block text-secondary"
                                th:text="${m.clave}"
                                >Clave</small
                            >
                        </td>
                        <td
                            th:attr="data-label=#{table.col.grupo}"
                            th:text="${m.grupo}"
                        >
                            Grupo
                        </td>
                        <td
                            th:attr="data-label=#{table.col.horario}"
                            th:text="${m.horario}"
                        >
                            Horario
                        </td>
                        <td
                            th:attr="data-label=#{table.col.salon}"
                            th:text="${m.salon}"
                        >
                            Salón
                        </td>
                        <td
                            th:attr="data-label=#{table.col.docente}"
                            th:text="${m.profesor}"
                        >
                            Docente
                        </td>
                        <td
                            th:attr="data-label=#{table.col.periodo}"
                            th:text="${m.periodo}"
                        >
                            Periodo
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- =========================================================
         TABLA DE CÁRDEX: tablaKardex
         Propósito: mostrar el historial académico de las materias con su
         periodo, calificación, estatus y oportunidad de cursado.
         Parámetros:
         - materias: colección de objetos con las propiedades materia, clave,
           periodo, calificacion, estatus y oportunidad.
         Comportamiento:
         - La tabla solo se renderiza cuando materias no está vacía.
         - Genera una fila por cada elemento de materias.
         - Reutiliza los fragmentos calificacion y opportunityBadge de
           fragments/components para mostrar la calificación y la oportunidad.
         Internacionalización: utiliza table.col.materia, table.col.periodo,
         table.col.calificacion, table.col.estatus y table.col.oportunidad.
         Presentación: Bootstrap table-responsive, table-hover y align-middle;
         la insignia de estatus utiliza status-badge.
         Los atributos data-label replican el nombre de cada columna para
         permitir estilos adaptables definidos en CSS.
         
         Se invoca así:
         <div th:replace="~{fragments/tables :: tablaKardex(${materias})}"></div>
         ========================================================= -->
        <div
            th:fragment="tablaKardex(materias)"
            class="table-responsive"
            th:unless="${#lists.isEmpty(materias)}"
        >
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col" th:text="#{table.col.materia}">
                            Materia
                        </th>
                        <th scope="col" th:text="#{table.col.periodo}">
                            Periodo
                        </th>
                        <th scope="col" th:text="#{table.col.calificacion}">
                            Calificación
                        </th>
                        <th scope="col" th:text="#{table.col.estatus}">
                            Estatus
                        </th>
                        <th scope="col" th:text="#{table.col.oportunidad}">
                            Oportunidad
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="m : ${materias}">
                        <td th:attr="data-label=#{table.col.materia}">
                            <strong th:text="${m.materia}">Materia</strong
                            ><small
                                class="d-block text-secondary"
                                th:text="${m.clave}"
                                >Clave</small
                            >
                        </td>
                        <td
                            th:attr="data-label=#{table.col.periodo}"
                            th:text="${m.periodo}"
                        >
                            Periodo
                        </td>
                        <!-- th:replace va en un <span> interno: si estuviera en el <td>,
                             reemplazaría la celda completa y la fila quedaría sin celda. -->
                        <td th:attr="data-label=#{table.col.calificacion}">
                            <span th:replace="~{fragments/components :: calificacion(${m.calificacion})}">—</span>
                        </td>
                        <td th:attr="data-label=#{table.col.estatus}">
                            <span
                                class="badge rounded-pill text-bg-light status-badge"
                                th:text="${m.estatus}"
                                >Estatus</span
                            >
                        </td>
                        <td th:attr="data-label=#{table.col.oportunidad}">
                            <span th:replace="~{fragments/components :: opportunityBadge(${m.oportunidad})}">Primera oportunidad</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
